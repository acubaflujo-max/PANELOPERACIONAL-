<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Flujo Cuba · Entrar</title>
<style>
  :root {
    --azul: #0E3A8C; --azul-osc: #061B4A; --rojo: #E8283A;
    --card: #fff; --txt: #14203a; --suave: #5b6783; --borde: #d9deea; --bg: #f3f5fa;
  }
  @media (prefers-color-scheme: dark) {
    :root { --card: #131c36; --txt: #e8ecf7; --suave: #93a0c0; --borde: #26325a; --bg: #0b1226; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    font: 15px/1.45 system-ui, sans-serif; color: var(--txt);
    background: linear-gradient(135deg, var(--azul), var(--azul-osc));
  }
  .caja { width: 100%; max-width: 360px; background: var(--card); border-radius: 16px; padding: 28px 24px; border-top: 5px solid var(--rojo); box-shadow: 0 12px 40px rgba(0, 0, 0, .35); }
  h1 { margin: 0 0 4px; font-size: 20px; text-align: center; }
  p { margin: 0 0 20px; text-align: center; color: var(--suave); font-size: 13px; }
  label { display: block; font-size: 12px; color: var(--suave); margin-bottom: 4px; }
  .campo { position: relative; }
  input { width: 100%; padding: 12px 44px 12px 12px; font: inherit; color: var(--txt); background: var(--bg); border: 1px solid var(--borde); border-radius: 10px; }
  input:focus { outline: 2px solid var(--azul); outline-offset: 1px; }
  .ver { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 40px; height: 36px; padding: 0; background: none; border: 0; cursor: pointer; font-size: 17px; }
  .entrar { width: 100%; margin-top: 16px; padding: 12px; font: inherit; font-weight: 700; color: #fff; background: var(--azul); border: 0; border-radius: 10px; cursor: pointer; }
  .entrar:disabled { opacity: .6; cursor: default; }
  #msg { min-height: 20px; margin-top: 12px; text-align: center; font-size: 13px; color: var(--rojo); }
</style>
</head>
<body>
<form class="caja" id="f" autocomplete="on">
  <h1>🇧🇷 Flujo Cuba Remesas 🇨🇺</h1>
  <p>Panel del negocio</p>
  <label for="clave">Contraseña</label>
  <div class="campo">
    <input id="clave" name="password" type="password" autocomplete="current-password" autofocus required>
    <button class="ver" id="ver" type="button" aria-label="Mostrar contraseña">👁</button>
  </div>
  <button class="entrar" id="entrar" type="submit">Entrar</button>
  <div id="msg" role="alert"></div>
</form>
<script>
  const $ = (id) => document.getElementById(id);
  $('ver').onclick = () => {
    const oculta = $('clave').type === 'password';
    $('clave').type = oculta ? 'text' : 'password';
    $('ver').setAttribute('aria-label', oculta ? 'Ocultar contraseña' : 'Mostrar contraseña');
  };
  $('f').onsubmit = async (e) => {
    e.preventDefault();
    $('entrar').disabled = true;
    $('msg').textContent = '';
    try {
      const r = await fetch('/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ clave: $('clave').value }),
      });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || 'No se pudo entrar');
      location.href = '/';
    } catch (err) {
      $('msg').textContent = err.message;
      $('entrar').disabled = false;
      $('clave').select();
    }
  };
</script>
</body>
</html>
